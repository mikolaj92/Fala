name: Linux ARM64

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: Linux ARM64 full smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Run product smoke suite
        run: mise exec -- pixi run full-smoke
