name: Linux ARM64

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: Linux ARM64 full smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Reproduce domain-maintenance crash with line tables
        run: |
          mise exec -- pixi run sqlite-schema
          mise exec -- pixi run bash -c 'cd vendor/sqlite.fire && mojo run --debug-level=line-tables -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/domain_store_maintenance.mojo'
