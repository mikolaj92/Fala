name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Product runtime is Mojo (osx-arm64 pixi). Ubuntu runners do not build Mojo here yet.
  docs-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Product layout checks
        run: |
          test -d mojo/fala
          test -f mojo/fala/journal_port.mojo
          test -f mojo/fala/native_process_host.mojo
          test -d legacy/python-engine
          test -f legacy/python-engine/README.md
          test ! -d src/fala
          # Fleet must not reappear as product adapter kind in Mojo validation.
          ! grep -q 'AdapterKind.fala_runtime' mojo/fala/adapters.mojo
          echo "layout ok: Mojo product, Python under legacy/"

  # Optional: historical CPython oracle (not product gate).
  legacy-python:
    runs-on: ubuntu-latest
    if: false  # enable only when validating oracle; not merge-gate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run legacy tests
        working-directory: legacy/python-engine
        run: |
          echo "wire local pyproject if re-enabling"
