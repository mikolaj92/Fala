name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Product runtime is Mojo (osx-arm64 pixi). Ubuntu runners do not build Mojo here yet.
  docs-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Product layout checks
        run: |
          test -d mojo/fala
          test -f mojo/fala/journal_port.mojo
          test -f mojo/fala/native_process_host.mojo
          test -f mojo/fala/jsonl_journal.mojo
          test ! -d src/fala
          test ! -d legacy/python-engine
          # Fleet must not reappear as product adapter kind.
          ! grep -q 'AdapterKind.fala_runtime' mojo/fala/adapters.mojo
          ! grep -q 'def put_runtime_pool' mojo/fala/domain_store.mojo
          ! grep -q 'def select_runtime' mojo/fala/runtime_policy.mojo
          echo "layout ok: exclusive Mojo product"
