# Fala package: run Splot 0.3+ Mojo as a subprocess effector.
# Requires sibling checkout: ../Splot (or SPLOT_ROOT).
version = "1"
id = "fala_splot_integration"
title = "Fala hosts Splot arbitration (Mojo)"

[[correlation_paths]]
id = "arbitrate"

[[correlation_paths.effectors]]
id = "splot_step"
capability = "arbitrate"
adapter = { kind = "subprocess", command = ["../Splot/tools/splot_step.sh"] }
