id: basic_enrichment
title: Basic impulse enrichment
description: Three subprocess boundaries coordinated by Fala.
tags: ["example"]
version: "2"
effectors:
  - id: ingest
    title: Ingest
    capability: ingest_source
    adapter:
      kind: subprocess
      command: ["python", "effectors/ingest.py"]
      cwd: "."
  - id: enrich
    title: Enrich
    capability: enrich_source
    conduction: [ingest]
    adapter:
      kind: subprocess
      command: ["python", "effectors/enrich.py"]
      cwd: "."
  - id: export
    title: Export
    capability: export_source
    conduction: [enrich]
    adapter:
      kind: subprocess
      command: ["python", "effectors/export.py"]
      cwd: "."
