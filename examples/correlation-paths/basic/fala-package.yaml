version: "2"
id: basic_examples
title: Basic Fala examples
description: Neutral impulse correlation-path examples for Fala.
tags: ["example"]

impulse_types:
  - id: source_payload
    title: Source payload
    media_types: ["text/plain", "application/json"]
    value_schema:
      type: object
      properties:
        source:
          type: string
      additionalProperties: true

association_kinds:
  - id: process_progress
    title: Process progress

reaction_kinds:
  - id: source_payload
    title: Source payload reaction
    media_types: ["text/plain", "application/json"]
  - id: enriched_payload
    title: Enriched payload
    media_types: ["application/json"]
  - id: exported_payload
    title: Exported payload
    media_types: ["application/json"]

capabilities:
  - id: ingest_source
    title: Ingest source
    accepts_impulse_types: [source_payload]
    emits_reaction_kinds: [source_payload]
    emits_association_kinds: [process_progress]
  - id: enrich_source
    title: Enrich source
    accepts_reaction_kinds: [source_payload]
    emits_reaction_kinds: [enriched_payload]
    emits_association_kinds: [process_progress]
  - id: export_source
    title: Export source
    accepts_reaction_kinds: [enriched_payload]
    emits_reaction_kinds: [exported_payload]
    emits_association_kinds: [process_progress]

correlation_paths:
  - id: basic_enrichment
    title: Basic enrichment
    effectors:
      - id: ingest
        capability: ingest_source
        adapter:
          kind: subprocess
          command: ["python", "effectors/ingest.py"]
          cwd: "."
      - id: enrich
        capability: enrich_source
        conduction: [ingest]
        adapter:
          kind: subprocess
          command: ["python", "effectors/enrich.py"]
          cwd: "."
      - id: export
        capability: export_source
        conduction: [enrich]
        adapter:
          kind: subprocess
          command: ["python", "effectors/export.py"]
          cwd: "."

runtime:
  backend:
    kind: sqlite
    path: .fala/state.sqlite
  reaction_store:
    kind: filesystem
    root: .fala/reactions
