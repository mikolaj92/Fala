version: "2"
id: splot_arbitration_basic
title: Splot arbitration basic

impulse_types:
  - id: splot.arbitration_case
    media_types:
      - application/json
    value_schema:
      type: object
      required:
        - claim_id
        - claimant
        - respondent
      properties:
        claim_id:
          type: string
        claimant:
          type: string
        respondent:
          type: string

association_kinds:
  - id: splot.jurisdiction
    value_schema:
      type: object
      required:
        - admissible
      properties:
        admissible:
          type: boolean
        reason:
          type: string

reaction_kinds:
  - id: splot.decision_report
    media_types:
      - application/json

capabilities:
  - id: splot.review
    accepts_impulse_types:
      - splot.arbitration_case
    emits_association_kinds:
      - splot.jurisdiction
    emits_reaction_kinds:
      - splot.decision_report

correlation_paths:
  - id: basic
    effectors:
      - id: review
        capability: splot.review
        adapter:
          kind: manual_homeostat

runtime:
  backend:
    kind: sqlite
    path: .fala/splot.sqlite
  reaction_store:
    kind: filesystem
    root: .fala/reactions
