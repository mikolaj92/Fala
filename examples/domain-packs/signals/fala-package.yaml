version: "2"
id: signals_basic
title: Signal monitoring domain pack
description: Impulse-first example for thresholded metric signals.
tags: ["domain-pack", "signals"]

impulse_types:
  - id: metric_sample
    title: Metric sample
    media_types: ["application/json"]
    value_schema:
      type: object
      required: ["name", "value"]
      properties:
        name:
          type: string
        value:
          type: number
        unit:
          type: string
      additionalProperties: true

association_kinds:
  - id: threshold_reading
    title: Threshold reading
    value_schema:
      type: object
      required: ["state"]
      properties:
        state:
          type: string
          enum: ["normal", "warning", "critical"]
        threshold:
          type: number
      additionalProperties: false

reaction_kinds:
  - id: signal_report
    title: Signal report
    media_types: ["application/json", "text/plain"]

capabilities:
  - id: classify_signal
    title: Classify signal
    accepts_impulse_types: [metric_sample]
    emits_association_kinds: [threshold_reading]
    emits_reaction_kinds: [signal_report]

correlation_paths:
  - id: classify_metric_sample
    title: Classify metric sample
    effectors:
      - id: classify
        capability: classify_signal
        adapter:
          kind: subprocess
          command: ["python", "effectors/classify.py"]
          cwd: "."

runtime:
  backend:
    kind: sqlite
    path: .fala/state.sqlite
  reaction_store:
    kind: filesystem
    root: .fala/reactions
