[workspace]
name = "fala"
version = "0.2.2"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0b3.dev2026071505"
sqlite = ">=3.51"

[tasks]
# Core: no sqlite.fire required for these.
core-status = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_status.mojo"
core-journal-memory = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_journal_memory.mojo"
core-correlation-pure = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_correlation_pure.mojo"
core-memory-e2e = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_memory_e2e.mojo"
core-smoke = "pixi run core-status && pixi run core-journal-memory && pixi run core-correlation-pure && pixi run core-memory-e2e"
# SQLite adapter (requires built vendor/sqlite.fire/native/libsqlite_fire.dylib)
sqlite-schema = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/sqlite_schema.mojo'"
adapter-smoke = "pixi run sqlite-schema"
# Full land gate (core + adapters present so far)
full-smoke = "pixi run core-smoke && pixi run adapter-smoke"
json-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/json.mojo"
toml-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/toml.mojo"
