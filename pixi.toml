[workspace]
name = "fala"
version = "0.7.31"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0"
sqlite = ">=3.51"

[tasks]
version-stamps = "python3 src/check_stamps.py"
setup-ember-json = "./tools/setup_ember_json.sh"
setup-sqlite-fire = { cmd = "./tools/setup_sqlite_fire.sh", depends-on = ["setup-ember-json"] }
core-status = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_status.mojo"
core-journal-memory = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_journal_memory.mojo"
core-correlation-pure = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_correlation_pure.mojo"
core-memory-e2e = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_memory_e2e.mojo"
core-driver-registry = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_driver_registry.mojo"
peer-to-peer = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/peer_to_peer.mojo"
core-smoke = { cmd = "pixi run core-status && pixi run core-journal-memory && pixi run core-correlation-pure && pixi run core-memory-e2e && pixi run core-driver-registry && pixi run peer-to-peer", depends-on = ["setup-ember-json"] }

# --- Shared adapters (memory/jsonl/package) ---
native-function = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/native_function_registry.mojo"
jsonl-journal = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/jsonl_journal.mojo"
tee-journal = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/tee_journal.mojo"
package-manifest = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/native_manifest.mojo"
json-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/json.mojo"
toml-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/toml.mojo"
sdk-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/sdk.mojo"
reaction-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/reaction.mojo"

# --- SQLite adapter (sqlite.fire) ---
open-journal = "./tools/mojo_sql_run.sh mojo/smoke/open_journal.mojo"
sqlite-schema = "./tools/mojo_sql_run.sh mojo/smoke/sqlite_schema.mojo"
sqlite-claim = "./tools/mojo_sql_run.sh mojo/smoke/sqlite_claim.mojo"
sqlite-journal-port = "./tools/mojo_sql_run.sh mojo/smoke/sqlite_journal_port.mojo 1"
schema-migration = "./tools/mojo_sql_run.sh mojo/smoke/schema_migration.mojo"
host-journal = "./tools/mojo_sql_run.sh mojo/smoke/host_journal.mojo"
domain-bridge = "./tools/mojo_sql_run.sh mojo/smoke/domain_store_bridge.mojo"
domain-maintenance = "./tools/mojo_sql_run.sh mojo/smoke/domain_store_maintenance.mojo"
domain-accept-impulse = "./tools/mojo_sql_run.sh mojo/smoke/domain_store_accept_impulse.mojo"
migration-smoke = "./tools/mojo_sql_run.sh mojo/smoke/migration.mojo"
cli-smoke = "./tools/mojo_sql_run.sh mojo/smoke/cli.mojo 1"
thin-core-layers = "./tools/mojo_sql_run.sh mojo/smoke/thin_core_layers.mojo 1"
native-cli-semantics = "./tools/mojo_sql_run.sh mojo/smoke/native_cli_semantics.mojo 1"
correlation-execution = "./tools/mojo_sql_run.sh mojo/smoke/correlation_execution.mojo 1"
correlation-persistence = "./tools/mojo_sql_run.sh mojo/smoke/correlation_persistence.mojo 1"
correlation-runtime = "./tools/mojo_sql_run.sh mojo/smoke/correlation_runtime.mojo 1"
native-driver = "./tools/mojo_sql_run.sh mojo/smoke/native_driver.mojo 1"
example-basic-native = "./tools/mojo_sql_run.sh mojo/smoke/example_basic_native.mojo 1"
adapter-persistence = "./tools/mojo_sql_run.sh mojo/smoke/adapter_persistence.mojo 1"
bridge-transport = "./tools/mojo_sql_run.sh mojo/smoke/bridge_transport.mojo 1"
finalization = "./tools/mojo_sql_run.sh mojo/smoke/finalization.mojo 1"
runtime-contracts = "./tools/mojo_sql_run.sh mojo/smoke/runtime_contracts.mojo 1"
correlation-advance = "./tools/mojo_sql_run.sh mojo/smoke/correlation_advance.mojo 1"
package-sdk-contracts = "./tools/mojo_sql_run.sh mojo/smoke/package_sdk_contracts.mojo 1"
splot-domain = "./tools/mojo_sql_run.sh mojo/smoke/splot_domain_pack.mojo 1"
takt-domain = "./tools/mojo_sql_run.sh mojo/smoke/takt_domain_pack.mojo 1"
concurrency-composition = "./tools/mojo_sql_run.sh mojo/smoke/concurrency_composition.mojo 1"
homeostat-rearm = "./tools/mojo_sql_run.sh mojo/smoke/homeostat_rearm.mojo 1"
homeostat-regulation = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/homeostat_regulation.mojo"
signals-domain = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/signals_domain_pack.mojo"
multi-organ-example = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/multi_organ_example.mojo"

# Requires sibling ../Splot (v0.3+) or SPLOT_ROOT. Hosts Mojo Splot via subprocess.
splot-integration = "./tools/mojo_sql_run.sh mojo/smoke/splot_integration.mojo 1"
native-process-host = "./tools/mojo_sql_run.sh mojo/smoke/native_process_host.mojo 1"
native-subprocess = "./tools/mojo_sql_run.sh mojo/smoke/native_subprocess.mojo 1"
# Pure unit regressions for UTF-8 StringSlice boundaries (Fala#121) — no process host.
utf8-adapter-boundaries = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/utf8_adapter_boundaries.mojo"
host-smoke = "pixi run native-process-host && pixi run native-subprocess && pixi run utf8-adapter-boundaries"
adapter-smoke = "pixi run sqlite-schema && pixi run sqlite-claim && pixi run sqlite-journal-port && pixi run schema-migration && pixi run host-journal && pixi run domain-bridge && pixi run domain-maintenance && pixi run domain-accept-impulse && pixi run migration-smoke && pixi run jsonl-journal && pixi run tee-journal && pixi run open-journal && pixi run native-function && pixi run package-manifest && pixi run json-smoke && pixi run toml-smoke && pixi run sdk-smoke && pixi run reaction-smoke && pixi run cli-smoke && pixi run thin-core-layers && pixi run host-smoke"

# Broader historical suite (fleet/runtime-policy intentionally absent)
extended-adapter-smoke = "pixi run adapter-smoke && pixi run native-cli-semantics && pixi run correlation-execution && pixi run correlation-persistence && pixi run correlation-runtime && pixi run correlation-advance && pixi run native-driver && pixi run adapter-persistence && pixi run finalization && pixi run runtime-contracts && pixi run package-sdk-contracts && pixi run example-basic-native && pixi run bridge-transport && pixi run splot-domain && pixi run concurrency-composition && pixi run homeostat-rearm && pixi run homeostat-regulation && pixi run signals-domain && pixi run multi-organ-example && pixi run takt-domain"

full-smoke = { cmd = "pixi run core-smoke && pixi run adapter-smoke", depends-on = ["setup-sqlite-fire"] }
extended-smoke = { cmd = "pixi run core-smoke && pixi run extended-adapter-smoke", depends-on = ["setup-sqlite-fire"] }
