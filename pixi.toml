[workspace]
name = "fala"
version = "0.2.2"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0b3.dev2026071505"
sqlite = ">=3.51"

[tasks]
# Core: no sqlite.fire required for these.
core-status = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_status.mojo"
core-journal-memory = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_journal_memory.mojo"
core-correlation-pure = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_correlation_pure.mojo"
core-memory-e2e = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_memory_e2e.mojo"
core-driver-registry = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/core_driver_registry.mojo"
core-smoke = "pixi run core-status && pixi run core-journal-memory && pixi run core-correlation-pure && pixi run core-memory-e2e && pixi run core-driver-registry"
# Package / native_function (core adapter surface; may link process host symbols)
native-function = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/native_function_registry.mojo"
open-journal = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/open_journal.mojo'"
jsonl-journal = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/jsonl_journal.mojo"
tee-journal = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/tee_journal.mojo"
package-manifest = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/native_manifest.mojo"
# SQLite adapter (requires built vendor/sqlite.fire/native/libsqlite_fire.dylib)
_sql = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src "
sqlite-schema = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/sqlite_schema.mojo'"
sqlite-claim = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/sqlite_claim.mojo'"
schema-migration = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/schema_migration.mojo'"
cli-smoke = "bash -ceu 'test -s vendor/sqlite.fire/native/libsqlite_fire.dylib || make -C vendor/sqlite.fire/native; mkdir -p mojo/fala/native; test -s mojo/fala/native/libfala_process_host.dylib || cc -std=c11 -Wall -Wextra -dynamiclib -o mojo/fala/native/libfala_process_host.dylib mojo/fala/native_process_host.c; cd vendor/sqlite.fire && mojo run -I ../../mojo -I ../EmberJson -I src ../../mojo/smoke/cli.mojo'"
adapter-smoke = "pixi run sqlite-schema && pixi run sqlite-claim && pixi run schema-migration && pixi run jsonl-journal && pixi run tee-journal && pixi run open-journal && pixi run native-function && pixi run package-manifest && pixi run cli-smoke"
# Full land gate (core + adapters present so far)
full-smoke = "pixi run core-smoke && pixi run adapter-smoke"
json-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/json.mojo"
toml-smoke = "mojo run -I mojo -I vendor/EmberJson mojo/smoke/toml.mojo"
