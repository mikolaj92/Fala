[project]
name = "fala"
version = "0.7.27"
description = "Event-first correlator — Mojo product + thin optional Python host binding."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikolaj92/Fala"
Repository = "https://github.com/mikolaj92/Fala"
Issues = "https://github.com/mikolaj92/Fala/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/fala"]
force-include = { "mojo" = "mojo" }

[tool.hatch.build.targets.sdist]
include = [
  "python/fala",
  "mojo",
  "examples",
  "docs",
  "tools",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pixi.toml",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
