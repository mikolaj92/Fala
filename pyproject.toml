[project]
name = "fala"
version = "0.2.2"
description = "Event-first correlator — product engine is Mojo (mojo/fala). CPython archived under legacy/python-engine/."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/mikolaj92/Fala"
Repository = "https://github.com/mikolaj92/Fala"
Issues = "https://github.com/mikolaj92/Fala/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Metadata-only project; product modules live under mojo/fala (Pixi/Mojo).
[tool.hatch.build.targets.wheel]
only-include = ["README.md"]
